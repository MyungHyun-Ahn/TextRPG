        type: 'SBasicStats'
        missing: default
        since: 3
      - name: m_battle
        type: 'SBattleProgress'
        missing: default
        since: 3
      - name: m_achievements
        type: 'vector<SAchievementProgress>'
        missing: reject
        since: 1
